  /* Brand Gradients */
  --grad-royal-deep: linear-gradient(135deg, #087C45 0%, #064E35 100%);
  --grad-hero: linear-gradient(180deg, #EAF7EF 0%, #FFFFFF 100%);

  /* Shadows */
  --shadow-xs: 0 1px 3px rgba(32, 40, 35, 0.05);
  --shadow-sm: 0 4px 12px rgba(8, 124, 69, 0.08);
  --shadow-md: 0 8px 24px rgba(32, 40, 35, 0.08);
  --shadow-lg: 0 16px 36px rgba(8, 124, 69, 0.14);
  --shadow-hover: 0 20px 40px rgba(8, 124, 69, 0.18);
  --shadow-gold: 0 12px 30px rgba(212, 175, 55, 0.28);

  /* Border radius */
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;

  --radius-full: 9999px;

  /* Typography */
  --font-main: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  --font-serif: 'Playfair Display', Georgia, serif;

  /* Transitions */
  --transition-fast: 0.18s cubic-bezier(0.16, 1, 0.3, 1);
